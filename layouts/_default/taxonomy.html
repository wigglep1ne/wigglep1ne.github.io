{{ define "main" }}
<section class="taxonomy-page">
  {{ partial "post-submenu.html" . }}
  {{ partial "post-search.html" . }}

  <header class="post-section-header">
    <p class="post-kicker">Browse publications</p>
    <h1>{{ .Title }}</h1>
  </header>

  <div class="taxonomy-list">
    {{ range .Data.Terms.Alphabetical }}
      <a class="taxonomy-card" href="{{ .Page.RelPermalink }}">
        <span>{{ .Page.LinkTitle }}</span>
        <span>{{ .Count }}</span>
      </a>
    {{ end }}
  </div>
</section>
{{ end }}
