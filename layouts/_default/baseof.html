<!doctype html>
<html lang="{{ .Site.Language.Locale }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const navigationMenu = document.querySelector('#primary-navigation');

    if (menuToggle && navigationMenu) {
      function setMenuOpen(isOpen) {
        menuToggle.setAttribute('aria-expanded', String(isOpen));
        menuToggle.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
        navigationMenu.classList.toggle('is-open', isOpen);
      }

      menuToggle.addEventListener('click', function() {
        const isOpen = menuToggle.getAttribute('aria-expanded') === 'true';
        setMenuOpen(!isOpen);
      });

      navigationMenu.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function() { setMenuOpen(false); });
      });

      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') setMenuOpen(false);
      });
    }

    function toggleTheme(){
      const html = document.documentElement;
      html.classList.toggle('dark');
      localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
      updateBtn();
    }
    function updateBtn(){
      const btn = document.querySelector('.theme-btn');
      if (btn) btn.textContent = document.documentElement.classList.contains('dark') ? '☀' : '☾';
    }
    updateBtn();
  </script>
</body>
</html>
