<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
<link rel="shortcut icon" href="{{ .Site.BaseURL }}static/favicon/favicon.ico">
<link rel="icon" type="image/svg+xml" href="{{ .Site.BaseURL }}static/favicon/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="{{ .Site.BaseURL }}static/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{ .Site.BaseURL }}static/favicon/favicon-16x16.png">
<link rel="apple-touch-icon" href="{{ .Site.BaseURL }}static/favicon/apple-touch-icon.png">
<link rel="manifest" href="{{ .Site.BaseURL }}static/favicon/site.webmanifest">
{{ partial "seo.html" . }}
{{ partial "umami.html" . }}
<style>
  :root { --bg: #fff; --fg: #222; }
  .dark { --bg: #1a1a1a; --fg: #eee; }
</style>
<script>
  (function(){const t=localStorage.getItem('theme');if(t==='dark')document.documentElement.classList.add('dark');})();
</script>
{{ $css := resources.Get "assets/css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
