<script type="application/json" id="post-search-index">[{"content":"Why keep a small site? A personal site should make it easy to publish ideas without adding unnecessary machinery. The first version of this site keeps the content in Markdown and lets Hugo build the pages.\nFewer moving parts Static content is easy to version, review, and move between hosts. That simplicity leaves more attention for the writing itself.\nRoom to grow Categories, tags, search, and post navigation provide useful structure while the collection is still small.\nWhat comes next This draft is a placeholder for a longer note about the tools and decisions behind the site.\n","summary":"A draft note about shaping a simple, searchable space for technical writing.","title":"A Small Note on Building This Site","url":"/~lbenicio/posts/draft-post/"}]</script>
<script>
  (function(){
    const search = document.querySelector('[data-post-search]');
    const indexElement = document.getElementById('post-search-index');
    if (!search || !indexElement) return;

    const input = search.querySelector('[data-post-search-input]');
    const searchForm = search.querySelector('[data-post-search-form]');
    const results = search.querySelector('[data-post-search-results]');
    const listing = document.querySelector('[data-post-listing]');
    const pagination = document.querySelector('[data-post-pagination]');
    let posts = [];

    try { posts = JSON.parse(indexElement.textContent || '[]'); }
    catch { return; }

    function renderResults(){
      const query = input.value.trim().toLocaleLowerCase();
      results.replaceChildren();

      if (!query) {
        results.hidden = true;
        if (listing) listing.hidden = false;
        if (pagination) pagination.hidden = false;
        return;
      }

      const matches = posts.filter(function(post){
        const searchableText = [post.title, post.summary, post.content].join(' ').toLocaleLowerCase();
        return searchableText.includes(query);
      });

      if (listing) listing.hidden = true;
      if (pagination) pagination.hidden = true;
      results.hidden = false;

      const count = document.createElement('p');
      count.className = 'post-search-count';
      count.textContent = matches.length + (matches.length === 1 ? ' post found' : ' posts found');
      results.appendChild(count);

      if (!matches.length) {
        const empty = document.createElement('p');
        empty.className = 'post-search-empty';
        empty.textContent = 'No posts match that search.';
        results.appendChild(empty);
        return;
      }

      matches.forEach(function(post){
        const result = document.createElement('article');
        result.className = 'post-search-result';

        const title = document.createElement('h2');
        const link = document.createElement('a');
        link.href = post.url;
        link.textContent = post.title;
        title.appendChild(link);
        result.appendChild(title);

        if (post.summary) {
          const summary = document.createElement('p');
          summary.textContent = post.summary;
          result.appendChild(summary);
        }

        results.appendChild(result);
      });
    }

    searchForm.addEventListener('submit', function(event){ event.preventDefault(); });
    input.addEventListener('input', renderResults);
  })();
</script>
